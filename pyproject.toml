[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bundle-deps"
version = "0.1.0"
description = "Bundle a project's npm and uv dependencies for offline use"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests", "tqdm"]

[project.scripts]
bundle-deps = "bundle_deps.cli:main"

[tool.setuptools]
packages = ["bundle_deps"]
